# ===========================================================================
# DAMRU AUTOPILOT v4 — 15-PROVIDER COUNCIL
# File: .github/workflows/damru_autopilot.yml
#
# FIXES:
#   [1] GITHUB_* env var prefix ban → renamed to GH_MODELS_TOKEN_VAL
#   [2] Secret name mismatch fixed: OPENROUTER_KEY → consistent
#   [3] Job condition syntax hardened
#   [4] 15-provider council: all free API keys wired
#   [5] DAMRU_SKIP_MISSING=1 — no crash on missing key
#   [6] Artifact upload on failure
#
# SECRETS needed (Settings → Secrets and variables → Actions):
#   HF_TOKEN, CEREBRAS_API_KEY, OPENROUTER_KEY, GH_MODELS_TOKEN
#   SAMBANOVA_API_KEY, TOGETHER_API_KEY, DEEPINFRA_API_KEY
#   HYPERBOLIC_API_KEY, MISTRAL_API_KEY, NVIDIA_NIM_KEY
#   CF_ACCOUNT_ID, CF_API_TOKEN
#   FIREWORKS_API_KEY, COHERE_API_KEY, CHUTES_API_KEY, SCALEWAY_API_KEY
#   GEMINI_KEY, KAGGLE_USERNAME, KAGGLE_KEY, KAGGLE_USERNAMES, KAGGLE_KEYS
# ===========================================================================

name: damru-autopilot

on:
  schedule:
    - cron: "0 */2 * * *"   # FORGE: har 2 ghante, 24/7
    - cron: "30 3 * * *"    # TRAIN: daily 09:00 IST
  workflow_dispatch:
    inputs:
      job:
        description: "Konsa job run karna hai"
        default: "forge"
        type: choice
        options: [forge, train]

concurrency:
  group: damru-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forge:
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'forge'
      || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -q requests huggingface_hub datasets tqdm

      - name: Forge quality data (15-Provider Council)
        env:
          # Core
          HF_TOKEN:             ${{ secrets.HF_TOKEN }}
          GEMINI_KEY:           ${{ secrets.GEMINI_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          # OpenRouter — secret name is OPENROUTER_KEY, code expects OPENROUTER_API_KEY
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_KEY }}
          # GitHub Models — secret name is GH_MODELS_TOKEN, code expects GH_MODELS_TOKEN_VAL
          GH_MODELS_TOKEN_VAL:  ${{ secrets.GH_MODELS_TOKEN }}
          # New providers
          SAMBANOVA_API_KEY:    ${{ secrets.SAMBANOVA_API_KEY }}
          TOGETHER_API_KEY:     ${{ secrets.TOGETHER_API_KEY }}
          DEEPINFRA_API_KEY:    ${{ secrets.DEEPINFRA_API_KEY }}
          HYPERBOLIC_API_KEY:   ${{ secrets.HYPERBOLIC_API_KEY }}
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_NIM_KEY:       ${{ secrets.NVIDIA_NIM_KEY }}
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:         ${{ secrets.CF_API_TOKEN }}
          FIREWORKS_API_KEY:    ${{ secrets.FIREWORKS_API_KEY }}
          COHERE_API_KEY:       ${{ secrets.COHERE_API_KEY }}
          CHUTES_API_KEY:       ${{ secrets.CHUTES_API_KEY }}
          SCALEWAY_API_KEY:     ${{ secrets.SCALEWAY_API_KEY }}
          # Forge config
          DAMRU_DATASET:        Damaru-ai/damru-knowledge
          DAMRU_MAX_ITERS:      "1200"
          DAMRU_PUSH_EVERY:     "40"
          DAMRU_KEEP_SCORE:     "4"
          DAMRU_SKIP_MISSING:   "1"
        run: |
          echo "[Forge] Starting with 15-Provider Council..."
          python - <<'PYEOF'
          import os
          providers = {
              "Cerebras":    bool(os.environ.get("CEREBRAS_API_KEY")),
              "OpenRouter":  bool(os.environ.get("OPENROUTER_API_KEY")),
              "GH Models":   bool(os.environ.get("GH_MODELS_TOKEN_VAL")),
              "HF Router":   bool(os.environ.get("HF_TOKEN")),
              "SambaNova":   bool(os.environ.get("SAMBANOVA_API_KEY")),
              "Together":    bool(os.environ.get("TOGETHER_API_KEY")),
              "DeepInfra":   bool(os.environ.get("DEEPINFRA_API_KEY")),
              "Hyperbolic":  bool(os.environ.get("HYPERBOLIC_API_KEY")),
              "Mistral":     bool(os.environ.get("MISTRAL_API_KEY")),
              "NVIDIA NIM":  bool(os.environ.get("NVIDIA_NIM_KEY")),
              "Cloudflare":  bool(os.environ.get("CF_API_TOKEN")),
              "Fireworks":   bool(os.environ.get("FIREWORKS_API_KEY")),
              "Cohere":      bool(os.environ.get("COHERE_API_KEY")),
              "Chutes":      bool(os.environ.get("CHUTES_API_KEY")),
              "Scaleway":    bool(os.environ.get("SCALEWAY_API_KEY")),
          }
          active  = [k for k,v in providers.items() if v]
          missing = [k for k,v in providers.items() if not v]
          print(f"Active providers ({len(active)}): {', '.join(active)}")
          if missing:
              print(f"Missing (will skip): {', '.join(missing)}")
          PYEOF
          python damru_data_forge.py

      - name: Upload forge log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-error-log-${{ github.run_number }}
          path: errors.log
          retention-days: 7

  train:
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'train'
      || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install -q kaggle

      - name: Trigger Kaggle self-training (5-account rotation)
        env:
          KAGGLE_USERNAME:  ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:       ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAMES: ${{ secrets.KAGGLE_USERNAMES }}
          KAGGLE_KEYS:      ${{ secrets.KAGGLE_KEYS }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
        run: |
          echo "[Train] Triggering Kaggle Brain Forge..."
          python damru_kaggle_trigger.py

      - name: Log success
        run: echo "[Train] Kaggle trigger dispatched successfully at $(date -u)"
