name: Damru Curious Learning Engine

on:
  schedule:
    # Har 6 ghante chalega
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  curious-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q requests beautifulsoup4 feedparser huggingface_hub datasets lxml

      - name: Run Curious Engine (self-healing)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: "Damaru-ai/damru-knowledge"
          MAX_CYCLES: "20"
        run: |
          for i in 1 2 3; do
            python damru_curious_engine_actions.py && break
            echo "Attempt $i failed, retrying..."
            sleep $((i * 5))
          done

      - name: Stats
        run: cat /tmp/damru_stats.txt 2>/dev/null || echo "No stats"
