name: Damru Daily Direct-Teacher (1M lines/day)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: damru-daily-learn
  cancel-in-progress: false

jobs:
  teach:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -q requests huggingface_hub
          echo "✓ Dependencies installed"
      
      - name: Generate 1M lines/day learning corpus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: Damaru-ai/damru-knowledge
          DAILY_TARGET_LINES: '1000000'
          GROQ_MODEL: llama-3.3-70b-versatile
          PARALLEL_WORKERS: '20'
        run: |
          echo "Starting daily learning generation..."
          python learn/daily_teacher.py
          echo "Generation complete!"
      
      - name: Commit daily corpus to git
        run: |
          git config user.name 'damru-daily-bot'
          git config user.email 'daily-bot@damru.ai'
          git add learn/daily/ learn/daily_manifest.json learn/human_behaviour.jsonl 2>/dev/null || true
          git commit -m "chore(learn): daily corpus $(date +%Y-%m-%d) - 1M lines" || echo "✓ Nothing to commit"
          git push origin main --no-verify || echo "✓ Push skipped"
      
      - name: Summary
        if: always()
        run: |
          echo "=== Daily Teacher Summary ==="
          if [ -f "learn/daily_manifest.json" ]; then
            tail -1 learn/daily_manifest.json
          fi
          echo "Workflow completed at $(date)"
