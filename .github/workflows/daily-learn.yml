name: Damru Daily Direct-Teacher (50k/day)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'
permissions:
  contents: write
concurrency:
  group: damru-daily-learn
  cancel-in-progress: false
jobs:
  teach:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests huggingface_hub
      - name: Generate daily learning corpus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: Damaru-ai/damru-knowledge
          DAILY_TARGET_LINES: '50000'
          GROQ_MODEL: llama-3.3-70b-versatile
        run: python learn/daily_teacher.py
      - name: Commit daily corpus to git
        run: |
          git config user.name 'damru-daily-bot'
          git config user.email 'daily-bot@damru.ai'
          git add learn/daily learn/daily_manifest.json learn/human_behaviour.jsonl || true
          git commit -m 'chore(learn): daily direct-teach corpus' || echo 'nothing to commit'
          git push || echo 'push skipped'
